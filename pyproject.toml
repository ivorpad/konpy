[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "konpy"
version = "0.5.0"
description = "Enforce structural conventions in Python codebases"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "wcmatch>=10",
]
keywords = ["lint", "consistent code", "code conventions", "python"]

[project.scripts]
konpy = "konpy.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[tool.hatch.build.targets.sdist]
only-include = [
    ".github",
    ".gitignore",
    "README.md",
    "docs",
    "konpy.json",
    "konpy.schema.json",
    "konpy.strict.json",
    "packs",
    "scripts",
    "src",
    "tests",
    "uv.lock",
]
# Internal working docs never ship (they are also gitignored).
exclude = ["docs/plans"]

[tool.hatch.build.targets.wheel]
packages = ["src/konpy"]

[tool.hatch.build.targets.wheel.force-include]
"docs/reference" = "konpy/_docs/reference"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/e2e/fixtures"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/e2e/fixtures", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
