name: Publish to PyPI

# Build the sdist + wheel via scripts/verify's release profile (full
# verification, then `uv build` + `twine check`) on a tag push, a published
# GitHub Release, or a manual dispatch, and publish to PyPI via Trusted
# Publishing (OIDC — no API token) when triggered by a tag or release.
# PR verification lives in ci.yml; running the full suite twice per PR
# would be waste.

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify and build release
        run: uv run --frozen scripts/verify release

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only publish on a tag push or a published release — never on PRs.
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/konpy
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
